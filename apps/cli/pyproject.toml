[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpulse-cli"
version = "0.1.0"
description = "Command line interface and CI quality gate for AgentPulse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
agentpulse = "agentpulse_cli.main:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["agentpulse_cli"]
